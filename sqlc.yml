version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "./internal/adapteres/postgresql/sqlc/queris.sql"
    schema: "./internal/adapteres/postgresql/migration"
    gen:
      go:
        package: "repo"
        out: "./internal/adapteres/postgresql/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true # generate Querier interface